
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>북딱 서바이벌 - 게임</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050705;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:2px 2px 3px black}
#stats{position:absolute;top:15px;left:15px;line-height:1.8;font-weight:bold}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:25px}
#message{position:absolute;top:17%;width:100%;text-align:center;font-size:clamp(20px,4vw,36px);font-weight:bold;color:#eee}
#hint{position:absolute;bottom:15px;width:100%;text-align:center;font-size:12px;color:#ccc}
#settings{position:absolute;right:12px;top:12px;pointer-events:auto;background:#101610dd;padding:12px;border:1px solid #657065;border-radius:8px;font-size:12px}
#settings input{width:100px}
#overlay{position:fixed;inset:0;z-index:5;background:#050805ee;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.panel{width:min(480px,100%);padding:30px;background:#101610;border:1px solid #536053;border-radius:12px}
h1{font-size:36px}
button{background:#922d2d;color:white;border:0;padding:12px 18px;border-radius:7px;font-weight:bold;font-size:15px}
#mobile{display:none;position:fixed;inset:0;pointer-events:none}
.pad{position:absolute;bottom:25px;left:18px;width:130px;height:130px;pointer-events:auto}
.pad button{position:absolute;width:42px;height:42px;padding:0;background:#344033cc;border:1px solid #aab5a7}
#up{left:44px;top:0}#down{left:44px;bottom:0}
#left{left:0;top:44px}#right{right:0;top:44px}
.actions{position:absolute;right:15px;bottom:25px;display:flex;gap:7px;pointer-events:auto}
.actions button{padding:13px 12px;background:#344033dd}
#look{position:absolute;left:40%;right:0;top:0;bottom:0;pointer-events:auto;touch-action:none}
@media(pointer:coarse){#mobile{display:block}#hint{bottom:175px}#settings{top:5px;right:5px}}
</style>
</head>
<body>

<div id="hud">
 <div id="stats">
  ❤️ 체력: <span id="hp">100</span><br>
  🔫 탄약: <span id="ammo">12</span><br>
  💀 처치: <span id="kills">0</span>
 </div>
 <div id="cross">+</div>
 <div id="message"></div>
 <div id="hint">WASD 이동 · 마우스 시점 · 클릭 발사 · Shift 달리기 · F 손전등 · R 재장전</div>
</div>

<div id="settings">
 <b>게임 설정</b><br>
 음악 <input id="volume" type="range" min="0" max="100" value="35"><br>
 효과음 <input id="sfx" type="range" min="0" max="100" value="65">
</div>

<div id="mobile">
 <div id="look"></div>
 <div class="pad">
  <button id="up">▲</button>
  <button id="down">▼</button>
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>
 <div class="actions">
  <button id="flash">빛</button>
  <button id="reload">장전</button>
  <button id="fire">발사</button>
 </div>
</div>

<div id="overlay">
 <div class="panel">
  <h1 id="title">북딱 서바이벌</h1>
  <p id="description">
   어두운 숲에서 살아남아라.<br>
   적이 나타나면 도망치거나 맞서 싸워라.
  </p>
  <button id="start">게임 시작</button>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);

const renderer=new THREE.WebGLRenderer({
 antialias:false,powerPreference:'low-power'
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080e0a);
scene.fog=new THREE.FogExp2(0x101910,0.035);

const camera=new THREE.PerspectiveCamera(
 75,innerWidth/innerHeight,.1,100
);
camera.position.set(0,1.65,5);

const player={
 hp:100,ammo:12,kills:0,
 yaw:0,pitch:0,
 dead:false,flash:true
};

scene.add(new THREE.HemisphereLight(0xa5b5a5,0x20251e,1));
const moon=new THREE.DirectionalLight(0x9cae9c,.45);
moon.position.set(-5,10,5);
scene.add(moon);

const flashlight=new THREE.SpotLight(
  0xffeacb,3.5,25,Math.PI/7,.5,1
);
camera.add(flashlight);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight.target);
scene.add(camera);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(180,180),
 new THREE.MeshLambertMaterial({color:0x20291f})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

const materials={
 trunk:new THREE.MeshLambertMaterial({color:0x392b20}),
 leaves:new THREE.MeshLambertMaterial({color:0x17271a}),
 rock:new THREE.MeshLambertMaterial({color:0x41443c}),
 wall:new THREE.MeshLambertMaterial({color:0x38382f}),
 skin:new THREE.MeshLambertMaterial({color:0xa98b72}),
 suit:new THREE.MeshLambertMaterial({color:0x242c30}),
 black:new THREE.MeshLambertMaterial({color:0x101313}),
 red:new THREE.MeshLambertMaterial({color:0x762727})
};

const obstacles=[];
function box(x,y,z,sx,sy,sz,mat,collision=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
 m.position.set(x,y,z);
 scene.add(m);
 if(collision)obstacles.push({x,z,rx:sx/2+.4,rz:sz/2+.4});
 return m;
}

function tree(x,z,s=1){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.16*s,.25*s,2.8*s,5),
  materials.trunk
 );
 trunk.position.set(x,1.4*s,z);
 scene.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(1.1*s,3.2*s,5),
  materials.leaves
 );
 leaves.position.set(x,3.5*s,z);
 scene.add(leaves);

 obstacles.push({x,z,rx:.5*s,rz:.5*s});
}

let seed=123;
function random(){
 seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296;
}

for(let i=0;i<110;i++){
 const x=(random()-.5)*70;
 const z=(random()-.5)*70;
 if(Math.hypot(x,z)>8)tree(x,z,.7+random()*.8);
}

// 버려진 마을
for(const [x,z] of [[-10,-12],[10,-17],[-17,8],[18,9]]){
 box(x,1.3,z,5,2.6,5,materials.wall);
 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(4,2,4),
  materials.black
 );
 roof.position.set(x,3.5,z);
 roof.rotation.y=Math.PI/4;
 scene.add(roof);
}

// 손에 든 총
const gun=new THREE.Group();
const gunMat=new THREE.MeshLambertMaterial({color:0x252a29});
const barrel=new THREE.Mesh(
 new THREE.BoxGeometry(.16,.15,.48),gunMat
);
barrel.position.set(.25,-.08,-.7);
gun.add(barrel);
camera.add(gun);

// 가상의 코믹 보스 캐릭터
function makeEnemy(){
 const g=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.75,1.1,.42),
  materials.suit
 );
 body.position.y=1.05;
 g.add(body);

 const head=new THREE.Mesh(
  new THREE.BoxGeometry(.53,.62,.5),
  materials.skin
 );
 head.position.y=1.92;
 g.add(head);

 const hair=new THREE.Mesh(
  new THREE.BoxGeometry(.57,.18,.54),
  materials.black
 );
 hair.position.y=2.28;
 g.add(hair);

 const tie=new THREE.Mesh(
  new THREE.BoxGeometry(.12,.5,.04),
  materials.red
 );
 tie.position.set(0,1.15,-.23);
 g.add(tie);

 for(const x of [-.2,.2]){
  const leg=new THREE.Mesh(
   new THREE.BoxGeometry(.2,.7,.2),
   materials.black
  );
  leg.position.set(x,.35,0);
  g.add(leg);
 }

 g.userData={hp:3,attack:0,alive:true};
 return g;
}

let enemy=null;
let spawnTimer=8;
let running=false;
let keys={};
let touch={};

const raycaster=new THREE.Raycaster();

// 오리지널 Web Audio 음악
let audio=null;
let master=null;
let musicGain=null;
let sfxGain=null;
let musicTimer=null;
let chaseMode=false;

function audioStart(){
 if(audio)return;
 audio=new AudioContext();
 master=audio.createGain();
 musicGain=audio.createGain();
 sfxGain=audio.createGain();

 musicGain.connect(master);
 sfxGain.connect(master);
 master.connect(audio.destination);

 musicGain.gain.value=.35;
 sfxGain.gain.value=.65;
 audio.resume();

 startAmbient();
}

function note(freq,duration,type='sine',volume=.08,channel=musicGain){
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 osc.type=type;
 osc.frequency.setValueAtTime(freq,audio.currentTime);
 gain.gain.setValueAtTime(volume,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(
  .001,audio.currentTime+duration
 );
 osc.connect(gain);
 gain.connect(channel);
 osc.start();
 osc.stop(audio.currentTime+duration);
}

function startAmbient(){
 if(!audio)return;
 clearInterval(musicTimer);
 chaseMode=false;

 musicTimer=setInterval(()=>{
  if(!running||!audio)return;
  if(chaseMode)return;

  const notes=[55,65.4,73.4,82.4];
  const f=notes[Math.floor(Math.random()*notes.length)];
  note(f,2,'sine',.045);
  if(Math.random()<.35)note(f*2,1.2,'triangle',.018);
 },1700);
}

function startChase(){
 if(!audio||chaseMode)return;
 chaseMode=true;
 clearInterval(musicTimer);

 musicTimer=setInterval(()=>{
  if(!running||!audio)return;
  note(90, .24,'sawtooth',.07);
  note(120, .15,'triangle',.035);
 },330);
}

function stopChase(){
 if(!chaseMode)return;
 startAmbient();
}

function effect(freq=150,duration=.12){
 if(!audio)return;
 note(freq,duration,'square',.09,sfxGain);
}

$('volume').oninput=e=>{
 if(musicGain)musicGain.gain.value=e.target.value/100;
};
$('sfx').oninput=e=>{
 if(sfxGain)sfxGain.gain.value=e.target.value/100;
};

function say(text){
 $('message').textContent=text;
 clearTimeout(say.timer);
 say.timer=setTimeout(()=>$('message').textContent='',2500);

 if('speechSynthesis' in window){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR';
  u.rate=1;
  u.pitch=.8;
  speechSynthesis.speak(u);
 }
}

function updateHUD(){
 $('hp').textContent=Math.max(0,Math.ceil(player.hp));
 $('ammo').textContent=player.ammo;
 $('kills').textContent=player.kills;
}

function spawn(){
 if(enemy||player.dead)return;

 enemy=makeEnemy();
 const a=random()*Math.PI*2;
 const d=19+random()*8;

 enemy.position.set(
  camera.position.x+Math.sin(a)*d,
  0,
  camera.position.z+Math.cos(a)*d
 );

 scene.add(enemy);

 const lines=[
  '북딱!',
  '부엉이바위!',
  '노무현 궁뎅이 성능좋다!'
 ];
 say(lines[Math.floor(random()*lines.length)]);
 effect(85,.6);
}

function shoot(){
 if(!running||player.dead)return;

 if(player.ammo<=0){
  effect(65,.1);
  return;
 }

 player.ammo--;
 updateHUD();
 effect(75,.09);

 gun.position.z=.12;
 setTimeout(()=>gun.position.z=0,70);

 if(enemy){
  raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
  const hits=raycaster.intersectObject(enemy,true);

  if(hits.length){
   enemy.userData.hp--;
   effect(220,.07);

   if(enemy.userData.hp<=0){
    scene.remove(enemy);
    enemy=null;
    player.kills++;
    updateHUD();
    say('명중! 잠시 안전해졌다.');
    spawnTimer=12;
    stopChase();
   }
  }
 }
}

function reload(){
 if(player.ammo<12){
  player.ammo=12;
  updateHUD();
  effect(350,.08);
 }
}

function endGame(){
 player.dead=true;
 running=false;
 say('야! 기분좋다!');
 clearInterval(musicTimer);
 effect(50,.7);

 setTimeout(()=>{
  $('overlay').style.display='flex';
  $('title').textContent='GAME OVER';
  $('description').innerHTML=
   '숲에서 쓰러졌다.<br>처치한 적: '+player.kills+'명';
  $('start').textContent='다시 시작';
  $('start').onclick=()=>location.reload();
 },500);
}

function collides(x,z){
 return obstacles.some(o=>
  Math.abs(x-o.x)<o.rx&&Math.abs(z-o.z)<o.rz
 );
}

function move(dt){
 const f=(keys.KeyW||touch.forward?1:0)-
         (keys.KeyS||touch.back?1:0);
 const s=(keys.KeyD||touch.right?1:0)-
         (keys.KeyA||touch.left?1:0);

 const speed=(keys.ShiftLeft?7:4.2)*dt;

 const dx=(Math.sin(player.yaw)*f+
           Math.cos(player.yaw)*s)*speed;

 const dz=(-Math.cos(player.yaw)*f+
           Math.sin(player.yaw)*s)*speed;

 if(!collides(camera.position.x+dx,camera.position.z))
  camera.position.x+=dx;

 if(!collides(camera.position.x,camera.position.z+dz))
  camera.position.z+=dz;
}

function updateEnemy(dt){
 if(!enemy)return;

 const dx=camera.position.x-enemy.position.x;
 const dz=camera.position.z-enemy.position.z;
 const d=Math.hypot(dx,dz);

 enemy.lookAt(camera.position.x,0,camera.position.z);

 if(d>1.4){
  enemy.position.x+=dx/d*1.8*dt;
  enemy.position.z+=dz/d*1.8*dt;
 }else{
  enemy.userData.attack-=dt;

  if(enemy.userData.attack<=0){
   player.hp-=12;
   enemy.userData.attack=1.1;
   effect(45,.2);
   updateHUD();

   if(player.hp<=0)endGame();
  }
 }

 if(d<12)startChase();
}

function toggleFlash(){
 player.flash=!player.flash;
 flashlight.visible=player.flash;
}

let last=performance.now();

function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.05);
 last=now;

 if(running&&!player.dead){
  move(dt);
  updateEnemy(dt);

  if(!enemy){
   spawnTimer-=dt;
   if(spawnTimer<=0)spawn();
  }

  camera.rotation.order='YXZ';
  camera.rotation.y=player.yaw;
  camera.rotation.x=player.pitch;
 }

 renderer.render(scene,camera);
}
requestAnimationFrame(loop);

// PC 조작
document.addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.code==='KeyF')toggleFlash();
 if(e.code==='KeyR')reload();
});
document.addEventListener('keyup',e=>keys[e.code]=false);

document.addEventListener('mousemove',e=>{
 if(document.pointerLockElement===renderer.domElement){
  player.yaw-=e.movementX*.0022;
  player.pitch=Math.max(-1.3,Math.min(1.3,
   player.pitch-e.movementY*.0022));
 }
});

renderer.domElement.addEventListener('click',()=>{
 if(!running)return;
 if(matchMedia('(pointer:fine)').matches&&
    document.pointerLockElement!==renderer.domElement){
  renderer.domElement.requestPointerLock?.();
 }else shoot();
});

// 모바일 조작
$('fire').onclick=shoot;
$('reload').onclick=reload;
$('flash').onclick=toggleFlash;

for(const [id,key] of [
 ['up','forward'],['down','back'],
 ['left','left'],['right','right']
]){
 const el=$(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();touch[key]=true;
 });
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  el.addEventListener(ev,()=>touch[key]=false);
 });
}

let lastTouch=null;
$('look').addEventListener('pointerdown',e=>{
 lastTouch={x:e.clientX,y:e.clientY};
 $('look').setPointerCapture(e.pointerId);
});
$('look').addEventListener('pointermove',e=>{
 if(!lastTouch)return;

 player.yaw-=(e.clientX-lastTouch.x)*.006;
 player.pitch=Math.max(-1.3,Math.min(1.3,
  player.pitch-(e.clientY-lastTouch.y)*.006));

 lastTouch={x:e.clientX,y:e.clientY};
});
['pointerup','pointercancel'].forEach(ev=>{
 $('look').addEventListener(ev,()=>lastTouch=null);
});

// 시작
$('start').onclick=()=>{
 audioStart();
 running=true;
 $('overlay').style.display='none';
 if(matchMedia('(pointer:fine)').matches)
  renderer.domElement.requestPointerLock?.();
 say('숲에 들어왔다... 조심해.');
};

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));
});
</script>
</body>
</html>
