<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>북딱 서바이벌</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050807;color:white;font-family:system-ui;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}#top{display:flex;gap:8px;padding:12px;flex-wrap:wrap}.pill{background:#07100dcc;border:1px solid #71807888;border-radius:9px;padding:8px 11px;font-weight:bold}#message{position:absolute;top:20%;left:50%;transform:translateX(-50%);font-size:30px;text-align:center}#overlay{position:fixed;inset:0;background:#020605ef;display:flex;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}.panel{max-width:520px;background:#0b1512;border:1px solid #71807888;border-radius:18px;padding:26px}.panel h1{font-size:42px}.panel p{line-height:1.7;color:#cbd5cf}button{border:1px solid #fff8;background:#101a17;color:white;border-radius:10px;padding:14px 22px;font-size:16px;font-weight:bold}.hidden{display:none!important}#joystick{position:fixed;left:22px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#d9e5df22;border:2px solid #d9e5df77;z-index:5}#stick{position:absolute;left:39px;top:39px;width:48px;height:48px;border-radius:50%;background:#d9e5df99;border:2px solid white}#look{position:fixed;right:0;bottom:0;width:55%;height:62%;z-index:3;touch-action:none}.controls{position:fixed;right:16px;bottom:24px;z-index:6;display:flex;gap:8px}.controls button{width:62px;height:62px;border-radius:50%;padding:4px;font-size:12px}@media(min-width:800px){#joystick,#look,.controls{display:none}}
</style></head><body><div id="game"></div><div id="hud"><div id="top"><div class="pill">❤️ 체력 <span id="hp">100</span></div><div class="pill">🔫 탄약 <span id="ammo">12</span>/12</div><div class="pill">📉 처치 <span id="kills">0</span>/52</div></div><div id="message"></div></div><div id="joystick"><div id="stick"></div></div><div id="look"></div><div class="controls"><button id="fire">발사</button><button id="reload">재장전</button><button id="flash">손전등</button></div><div id="overlay"><div class="panel" id="panel"><h1>북딱 서바이벌</h1><p>어두운 숲에서 살아남아라.<br>PC: WASD 이동 · 마우스 시점 · 클릭 발사 · R 재장전 · F 손전등<br>모바일: 왼쪽 조이스틱 이동 · 오른쪽 드래그 시점</p><button id="start">게임 시작</button></div></div>
<script>window.gameStarted=false;document.getElementById('start').addEventListener('click',function(){window.gameStarted=true;document.getElementById('overlay').classList.add('hidden');if(window.beginGame)window.beginGame()});</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x030806);scene.fog=new THREE.FogExp2(0x07100b,.038);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,180);camera.position.set(0,1.7,5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));document.getElementById('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x9aa9a0,0x10150f,.6));const moon=new THREE.DirectionalLight(0x9aafaa,.6);moon.position.set(-15,25,10);scene.add(moon);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:1});const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x172019));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);const light=new THREE.SpotLight(0xe5f0d8,3.2,32,Math.PI/7,.55,1.2);camera.add(light);light.target.position.set(0,0,-1);camera.add(light.target);scene.add(camera);const trunk=mat(0x30251b),leaves=[mat(0x10251a),mat(0x18301f),mat(0x203923)];for(let i=0;i<170;i++){let x=(Math.random()-.5)*105,z=(Math.random()-.5)*105;if(Math.abs(x)<4&&Math.abs(z)<8)continue;let t=new THREE.Group();t.position.set(x,0,z);let b=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,3.4,7),trunk);b.position.y=1.7;t.add(b);for(let j=0;j<3;j++){let c=new THREE.Mesh(new THREE.ConeGeometry(1.35-j*.2,2.4,7),leaves[Math.floor(Math.random()*3)]);c.position.y=3.2+j*.8;t.add(c)}scene.add(t)}
const player={hp:100,ammo:12,kills:0,flash:true};let started=false,ended=false,yaw=0,pitch=0,lastShot=0,joyX=0,joyY=0,damage=0;const keys={},enemies=[],clock=new THREE.Clock();const $=id=>document.getElementById(id);function hud(){$('hp').textContent=Math.max(0,Math.ceil(player.hp));$('ammo').textContent=player.ammo;$('kills').textContent=player.kills}
function makeEnemy(){let g=new THREE.Group(),skin=mat(0xb98768),suit=mat(0x111313),hair=mat(0x211b18);let h=new THREE.Mesh(new THREE.SphereGeometry(.36,16,12),skin);h.position.y=2.58;g.add(h);let cap=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),hair);cap.position.set(0,2.78,-.03);g.add(cap);let body=new THREE.Mesh(new THREE.BoxGeometry(.84,1.02,.42),suit);body.position.y=1.55;g.add(body);let arms=[];for(let s of [-1,1]){let a=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.5,4,8),suit);a.position.set(s*.48,1.6,0);g.add(a);arms.push(a);let l=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.62,4,8),suit);l.position.set(s*.22,.68,0);g.add(l)}g.userData={arms,phase:Math.random()*6};return g}
function spawn(){let e=makeEnemy(),a=Math.random()*Math.PI*2,d=20+Math.random()*13;e.position.set(camera.position.x+Math.sin(a)*d,0,camera.position.z-Math.cos(a)*d);scene.add(e);enemies.push(e)}for(let i=0;i<4;i++)spawn();let audio;function beep(freq=150){try{audio??=new (AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.value=.06;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.14);o.stop(audio.currentTime+.14)}catch(e){}}
function finish(msg){ended=true;$('panel').innerHTML='<h1>게임 종료</h1><p>'+msg+'</p><button id="again">다시 시작</button>';$('overlay').classList.remove('hidden');$('again').onclick=()=>location.reload()}
function shoot(){if(!started||ended||performance.now()-lastShot<260)return;lastShot=performance.now();if(!player.ammo){beep(70);return}player.ammo--;hud();beep(110);let dir=new THREE.Vector3();camera.getWorldDirection(dir);let ray=new THREE.Raycaster(camera.position,dir,0,55),targets=[];enemies.forEach(e=>e.traverse(o=>{if(o.isMesh)targets.push(o)}));let hit=ray.intersectObjects(targets)[0];if(hit){let e=enemies.find(x=>{let yes=false;x.traverse(o=>{if(o===hit.object)yes=true});return yes});if(e){scene.remove(e);enemies.splice(enemies.indexOf(e),1);player.kills++;hud();if(player.kills>=52)finish('야! 기분좋다!<br>52킬 달성!');else setTimeout(()=>{if(!ended)spawn()},900)}}}
function reload(){if(!started||ended||player.ammo===12)return;$('message').textContent='재장전...';setTimeout(()=>{player.ammo=12;hud();$('message').textContent='';beep(320)},1100)}function toggle(){player.flash=!player.flash;light.intensity=player.flash?3.2:0}window.beginGame=()=>{started=true;try{audio??=new (AudioContext||webkitAudioContext)();audio.resume()}catch(e){}};$('fire').onpointerdown=shoot;$('reload').onclick=reload;$('flash').onclick=toggle;addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload();if(e.code==='KeyF')toggle();if(e.code==='Space')shoot()});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.onclick=()=>{if(started&&matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()};addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-1.25,Math.min(1.25,pitch-e.movementY*.0025))}});
let joy=$('joystick'),stick=$('stick'),joyOn=false;function moveJoy(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy),s=Math.min(1,43/(d||1));joyX=dx*s/43;joyY=dy*s/43;stick.style.transform=`translate(${dx*s}px,${dy*s}px)`}joy.onpointerdown=e=>{joyOn=true;joy.setPointerCapture(e.pointerId);moveJoy(e)};joy.onpointermove=e=>{if(joyOn)moveJoy(e)};function joyEnd(){joyOn=false;joyX=joyY=0;stick.style.transform='translate(0,0)'}joy.onpointerup=joyEnd;joy.onpointercancel=joyEnd;let look=$('look'),lookId=null,lx=0,ly=0;look.onpointerdown=e=>{lookId=e.pointerId;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)};look.onpointermove=e=>{if(lookId!==e.pointerId)return;yaw-=(e.clientX-lx)*.006;pitch=Math.max(-1.25,Math.min(1.25,pitch-(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY};look.onpointerup=look.onpointercancel=()=>lookId=null;
function update(dt){if(!started||ended)return;let f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),m=new THREE.Vector3();if(keys.KeyW)m.add(f);if(keys.KeyS)m.sub(f);if(keys.KeyD)m.add(r);if(keys.KeyA)m.sub(r);m.add(f.clone().multiplyScalar(-joyY));m.add(r.clone().multiplyScalar(joyX));if(m.lengthSq())camera.position.add(m.normalize().multiplyScalar(5*dt));camera.position.y=1.7;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;light.intensity=player.flash?3.2:0;for(let e of enemies){let dx=camera.position.x-e.position.x,dz=camera.position.z-e.position.z,d=Math.hypot(dx,dz);if(d>1.35){e.position.x+=dx/d*2.5*dt;e.position.z+=dz/d*2.5*dt;e.rotation.y=Math.atan2(dx,dz);e.userData.phase+=dt*8;e.userData.arms.forEach((a,i)=>a.rotation.x=Math.sin(e.userData.phase)*(i?-.5:.5))}else if(performance.now()>damage){damage=performance.now()+850;player.hp-=12;hud();beep(60);if(player.hp<=0)finish('숲속에서 쓰러졌다...')}}if(!enemies.length&&player.kills<52)spawn()}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);update(dt);renderer.render(scene,camera)}hud();loop();
</script></body></html>
