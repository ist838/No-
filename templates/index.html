<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>북딱 서바이벌</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,#17271d 0,#080e0b 48%,#020403 100%);color:#f3f5f2;font-family:system-ui,sans-serif}
main{width:min(100%,680px);padding:clamp(25px,6vw,55px);text-align:center;background:#0b1511eF;border:1px solid #64776a88;border-radius:22px;box-shadow:0 24px 90px #000a}
.tag{display:inline-block;padding:7px 12px;border:1px solid #82988788;border-radius:99px;color:#c6d6c9;font-size:13px;letter-spacing:.08em}
h1{font-size:clamp(42px,10vw,76px);line-height:1.05;margin:22px 0 12px}
p{color:#c4cec7;line-height:1.8}
button{margin-top:20px;padding:15px 30px;border:0;border-radius:12px;background:#d8e4d8;color:#101811;font-size:18px;font-weight:900;cursor:pointer}
button:hover{filter:brightness(1.08)}
.small{margin-top:25px;font-size:13px;color:#84958a}
</style>
</head>
<body>
<main>
 <span class="tag">3D FIRST-PERSON SURVIVAL</span>
 <h1>북딱<br>서바이벌</h1>
 <p>어두운 숲속에서 추격자를 피하고 살아남아라.<br>손전등을 켜고, 탄약을 확인하고, 52킬에 도전하라.</p>
 <button onclick="location.href='/game'">게임 시작하기</button>
 <div class="small">PC: WASD 이동 · 마우스 시점 · 클릭/스페이스 발사<br>모바일: 왼쪽 조이스틱 이동 · 오른쪽 드래그 시점</div>
</main>
</body>
</html>
