<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>북딱 서바이벌</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050807;color:#fff;font-family:system-ui,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}
#top{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap}
.pill{background:#07100dcc;border:1px solid #71807888;border-radius:9px;padding:8px 11px;font-weight:800}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;pointer-events:none;z-index:20}
.cross-h,.cross-v{position:absolute;background:#fff;box-shadow:0 0 4px #000,0 0 8px #000}
.cross-h{width:28px;height:3px;top:12.5px;left:0}
.cross-v{width:3px;height:28px;left:12.5px;top:0}
#message{position:absolute;top:19%;left:50%;transform:translateX(-50%);font-size:clamp(20px,4vw,38px);font-weight:900;text-align:center;white-space:pre-line}
#settings{position:absolute;right:12px;top:12px;pointer-events:auto;background:#07100dcc;padding:8px;border-radius:10px;font-size:12px}
#settings label{display:block}input[type=range]{width:105px}
#joystick{position:fixed;left:22px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#d9e5df22;border:2px solid #d9e5df77;z-index:5;touch-action:none}
#stick{position:absolute;left:39px;top:39px;width:48px;height:48px;border-radius:50%;background:#d9e5df99;border:2px solid white}
#look{position:fixed;right:0;bottom:0;width:55%;height:62%;z-index:3;touch-action:none}
.controls{position:fixed;right:16px;bottom:24px;z-index:6;display:flex;gap:9px;pointer-events:auto}
button{border:1px solid #ffffff88;background:#101a17dd;color:white;border-radius:50%;width:62px;height:62px;font-weight:900;font-size:13px}
button:active{background:#52645b}
#overlay{position:fixed;inset:0;background:#020605ef;display:flex;align-items:center;justify-content:center;z-index:10;text-align:center;padding:24px}
.panel{max-width:520px;background:#0b1512;border:1px solid #71807888;border-radius:18px;padding:26px}
.panel h1{font-size:clamp(32px,7vw,54px);margin:0 0 8px}.panel p{line-height:1.7;color:#cbd5cf}
.panel button{border-radius:10px;width:auto;height:auto;padding:13px 22px;font-size:16px}
.hidden{display:none!important}
@media(min-width:800px){ #joystick,#look,.controls{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="top">
    <div class="pill">❤️ 체력 <span id="hp">100</span></div>
    <div class="pill">🔫 탄약 <span id="ammo">12</span>/12</div>
    <div class="pill">📉 처치 <span id="kills">0</span>/52</div>
  </div>
  <div id="cross">
    <div class="cross-h"></div>
    <div class="cross-v"></div>
  </div>
  <div id="message"></div>
  <div id="settings">
    <label>🎵 음악 <input id="musicVol" type="range" min="0" max="1" step=".05" value=".35"></label>
    <label>🔊 효과음 <input id="sfxVol" type="range" min="0" max="1" step=".05" value=".6"></label>
  </div>
</div>
<div id="joystick"><div id="stick"></div></div>
<div id="look"></div>
<div class="controls">
  <button id="fire">발사</button>
  <button id="reload">재장전</button>
  <button id="flash">손전등</button>
</div>
<div id="overlay">
  <div class="panel">
    <span style="display:inline-block;padding:7px 12px;border:1px solid #82988788;border-radius:99px;color:#c6d6c9;font-size:13px;letter-spacing:.08em">3D FIRST-PERSON SURVIVAL</span>
    <h1 style="font-size:clamp(42px,10vw,76px);line-height:1.05;margin:22px 0 12px">북딱<br>서바이벌</h1>
    <p>어두운 숲속에서 추격자를 피하고 살아남아라.<br>손전등을 켜고, 탄약을 확인하고, 52킬에 도전하라.</p>
    <button id="start">게임 시작하기</button>
    <p style="font-size:13px;color:#aab8ae;margin-top:22px">PC: WASD 이동 · 마우스 시점 · 클릭/스페이스 발사 · R 재장전 · F 손전등<br>모바일: 왼쪽 조이스틱 이동 · 오른쪽 화면 드래그 시점</p>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const mount = document.querySelector('#game');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030806);
scene.fog = new THREE.FogExp2(0x07100b, 0.038);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 180);
camera.position.set(0, 1.7, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
mount.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9aa9a0, 0x10150f, 0.48));
const moon = new THREE.DirectionalLight(0x9aafaa, 0.55);
moon.position.set(-15, 25, 10);
moon.castShadow = true;
scene.add(moon);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 220),
  new THREE.MeshStandardMaterial({ color: 0x172019, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.04;
ground.receiveShadow = true;
scene.add(ground);

const flashlight = new THREE.SpotLight(0xe5f0d8, 3.2, 32, Math.PI / 7, 0.55, 1.2);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

const ambientGlow = new THREE.PointLight(0x91a58d, 0.22, 8);
camera.add(ambientGlow);

const mat = (color, roughness = 1) => new THREE.MeshStandardMaterial({ color, roughness });
const trunkMat = mat(0x30251b);
const leafMats = [mat(0x10251a), mat(0x18301f), mat(0x203923)];

function tree(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 3.4, 7), trunkMat);
  trunk.position.y = 1.7;
  trunk.castShadow = true;
  g.add(trunk);
  for (let i = 0; i < 3; i++) {
    const crown = new THREE.Mesh(new THREE.ConeGeometry(1.35 - i * 0.2, 2.4, 7), leafMats[(Math.random() * 3) | 0]);
    crown.position.y = 3.2 + i * 0.8;
    crown.castShadow = true;
    g.add(crown);
  }
  scene.add(g);
}

for (let i = 0; i < 170; i++) {
  let x = (Math.random() - 0.5) * 105;
  let z = (Math.random() - 0.5) * 105;
  if (Math.abs(x) > 4 || Math.abs(z) > 8) tree(x, z);
}

for (let i = 0; i < 7; i++) {
  const z = -12 - i * 9;
  const house = new THREE.Group();
  house.position.set((i % 2 ? 1 : -1) * (7 + Math.random() * 3), 0, z);
  const body = new THREE.Mesh(new THREE.BoxGeometry(3, 2.3, 3), mat(0x292820));
  body.position.y = 1.15;
  house.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.5, 1.5, 4), mat(0x171815));
  roof.position.y = 3;
  roof.rotation.y = Math.PI / 4;
  house.add(roof);
  scene.add(house);
}

const player = { hp: 100, ammo: 12, kills: 0, reloading: false, flash: true };
let started = false, ended = false, lastShot = 0, damageTimer = 0;
const keys = {};
let yaw = 0, pitch = 0;
const enemies = [];
const clock = new THREE.Clock();
const ui = {
  hp: document.querySelector('#hp'),
  ammo: document.querySelector('#ammo'),
  kills: document.querySelector('#kills'),
  msg: document.querySelector('#message')
};

function updateHud() {
  ui.hp.textContent = Math.max(0, Math.ceil(player.hp));
  ui.ammo.textContent = player.ammo;
  ui.kills.textContent = player.kills;
}

function makeEnemy() {
  const e = new THREE.Group();
  const skin = mat(0xb98768, 0.9);
  const suit = mat(0x111313);
  const shirt = mat(0xe7e5dc);
  const hair = mat(0x211b18);
  const tie = mat(0x8d1717);
  const eye = mat(0xf5eee4);
  const dark = mat(0x17110f);

  function part(parent, geo, m, x, y, z) {
    const o = new THREE.Mesh(geo, m);
    o.position.set(x, y, z);
    o.castShadow = true;
    o.receiveShadow = true;
    parent.add(o);
    return o;
  }

  const head = new THREE.Group();
  head.position.y = 2.58;
  e.add(head);
  part(head, new THREE.SphereGeometry(0.36, 24, 20), skin, 0, 0, 0);
  part(head, new THREE.SphereGeometry(0.25, 20, 16), skin, 0, -0.19, 0.06);
  for (const s of [-1, 1]) {
    part(head, new THREE.SphereGeometry(0.085, 12, 12), skin, s * 0.35, -0.01, 0);
    part(head, new THREE.SphereGeometry(0.05, 12, 12), eye, s * 0.13, 0.07, 0.30);
    part(head, new THREE.SphereGeometry(0.023, 10, 10), dark, s * 0.13, 0.07, 0.345);
  }
  part(head, new THREE.SphereGeometry(0.07, 12, 12), skin, 0, -0.015, 0.33);
  part(head, new THREE.SphereGeometry(0.37, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.47), hair, 0, 0.08, -0.02);
  part(e, new THREE.CylinderGeometry(0.1, 0.13, 0.22, 12), skin, 0, 2.15, 0);
  part(e, new THREE.BoxGeometry(0.84, 1.02, 0.42), suit, 0, 1.55, 0);
  part(e, new THREE.BoxGeometry(0.22, 0.82, 0.025), shirt, 0, 1.57, 0.22);
  part(e, new THREE.ConeGeometry(0.07, 0.42, 4), tie, 0, 1.55, 0.25);

  const limbs = [];
  for (const s of [-1, 1]) {
    const arm = new THREE.Group();
    arm.position.set(s * 0.47, 1.92, 0);
    e.add(arm);
    part(arm, new THREE.CapsuleGeometry(0.12, 0.5, 4, 8), suit, 0, -0.3, 0);
    part(arm, new THREE.SphereGeometry(0.1, 10, 10), skin, 0, -0.6, 0.02);
    limbs.push({ mesh: arm, side: s, type: 'arm' });

    const leg = new THREE.Group();
    leg.position.set(s * 0.22, 1.05, 0);
    e.add(leg);
    part(leg, new THREE.CapsuleGeometry(0.14, 0.62, 4, 8), suit, 0, -0.37, 0);
    part(leg, new THREE.BoxGeometry(0.27, 0.13, 0.4), dark, 0, -0.78, 0.1);
    limbs.push({ mesh: leg, side: s, type: 'leg' });
  }

  e.userData = { head, limbs, phase: Math.random() * 6, hit: false };
  return e;
}

function spawnEnemy() {
  const e = makeEnemy();
  const a = Math.random() * Math.PI * 2;
  const d = 20 + Math.random() * 13;
  e.position.set(camera.position.x + Math.sin(a) * d, 0, camera.position.z - Math.cos(a) * d);
  scene.add(e);
  enemies.push(e);
}

for (let i = 0; i < 4; i++) spawnEnemy();

let audioCtx = null, ambGain = null;

function sound(freq = 180, duration = 0.12, type = 'sawtooth', volume = 0.12) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.value = volume * Number(document.querySelector('#sfxVol').value);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  o.stop(audioCtx.currentTime + duration);
}

function startAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  ambGain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 42;
  ambGain.gain.value = 0.02 * Number(document.querySelector('#musicVol').value);
  osc.connect(ambGain);
  ambGain.connect(audioCtx.destination);
  osc.start();
}

document.querySelector('#musicVol').addEventListener('input', e => {
  if (ambGain) ambGain.gain.value = 0.02 * Number(e.target.value);
});

// 무서운 배경 음악
let musicTimer = 0;
const scaryNotes = [41.2, 46.25, 49, 55, 61.74, 65.41, 73.42];
let noteIndex = 0;

function scaryMusic() {
  if (!started || ended || !audioCtx) {
    requestAnimationFrame(scaryMusic);
    return;
  }
  musicTimer += clock.getDelta();
  if (musicTimer > 1.6 + Math.random() * 1.4) {
    musicTimer = 0;
    const freq = scaryNotes;
    noteIndex++;
    sound(freq, 1.1, 'sine', 0.035);
    if (Math.random() < 0.3) {
      setTimeout(() => sound(freq * 1.6, 0.35, 'sawtooth', 0.025), 180);
    }
    if (Math.random() < 0.18) {
      setTimeout(() => sound(38, 0.12, 'square', 0.05), 80);
      setTimeout(() => sound(38, 0.12, 'square', 0.05), 220);
    }
  }
  requestAnimationFrame(scaryMusic);
}
scaryMusic();

function shoot() {
  if (!started || ended || player.reloading) return;
  const now = performance.now();
  if (now - lastShot < 260) return;
  lastShot = now;
  if (player.ammo <= 0) {
    sound(90, 0.08, 'square', 0.05);
    return;
  }
  player.ammo--;
  updateHud();
  sound(105, 0.13, 'square', 0.22);

  const origin = camera.position.clone();
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const ray = new THREE.Raycaster(origin, dir, 0, 55);
  const targets = [];
  for (const e of enemies) {
    e.traverse(o => { if (o.isMesh) targets.push(o); });
  }
  const hits = ray.intersectObjects(targets, false);
  if (hits.length) {
    const e = enemies.find(en => {
      let found = false;
      en.traverse(o => { if (o === hits[0].object) found = true; });
      return found;
    });
    if (e && !e.userData.hit) {
      e.userData.hit = true;
      scene.remove(e);
      enemies.splice(enemies.indexOf(e), 1);
      player.kills++;
      sound(620, 0.2, 'triangle', 0.12);
      updateHud();
      setTimeout(() => {
        if (!ended && player.kills < 52) spawnEnemy();
      }, 900);
      if (player.kills >= 52) specialEnding();
    }
  }
}

function reload() {
  if (!started || ended || player.reloading || player.ammo === 12) return;
  player.reloading = true;
  ui.msg.textContent = '재장전...';
  setTimeout(() => {
    player.ammo = 12;
    player.reloading = false;
    ui.msg.textContent = '';
    updateHud();
    sound(320, 0.1, 'triangle', 0.08);
  }, 1250);
}

function specialEnding() {
  ended = true;
  ui.msg.textContent = '부엉이바위의 끝...';
  sound(75, 0.9, 'sawtooth', 0.2);
  let t = 0;
  function fall() {
    t += 0.016;
    camera.position.y = Math.max(-8, 1.7 - t * 5);
    camera.rotation.z = Math.sin(t * 5) * 0.08;
    if (t < 1.7) requestAnimationFrame(fall);
    else showEnd('야! 기분좋다!\n52킬 달성!');
  }
  fall();
}

function showEnd(text) {
  const overlay = document.querySelector('#overlay');
  overlay.classList.remove('hidden');
  overlay.style.display = 'flex';
  document.querySelector('.panel').innerHTML = `
    <h1>게임 종료</h1>
    <p>${text.replace('\n', '<br>')}</p>
    <button id="again">다시 시작</button>
  `;
  document.querySelector('#again').onclick = () => location.reload();
}

function hurt() {
  if (performance.now() < damageTimer) return;
  damageTimer = performance.now() + 850;
  player.hp -= 12;
  updateHud();
  sound(65, 0.18, 'sawtooth', 0.15);
  if (player.hp <= 0) {
    ended = true;
    showEnd('숲속에서 쓰러졌다...');
  }
}

function update(dt) {
  if (!started || ended) return;

  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  let move = new THREE.Vector3();

  if (keys.KeyW || joyY < -0.15) move.add(forward.clone().multiplyScalar(keys.KeyW ? 1 : -joyY));
  if (keys.KeyS || joyY > 0.15) move.add(forward.clone().multiplyScalar(keys.KeyS ? -1 : -joyY));
  if (keys.KeyD || joyX > 0.15) move.add(right.clone().multiplyScalar(keys.KeyD ? 1 : joyX));
  if (keys.KeyA || joyX < -0.15) move.add(right.clone().multiplyScalar(keys.KeyA ? -1 : joyX));

  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(5.2 * dt);
    camera.position.add(move);
  }

  camera.position.y = 1.7;
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  flashlight.intensity = player.flash ? (3.0 + (Math.random() < 0.012 ? -1.5 : 0)) : 0;

  for (const e of enemies) {
    const dx = camera.position.x - e.position.x;
    const dz = camera.position.z - e.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 1.35) {
      const speed = dist < 8 ? 3.4 : 2.25;
      e.position.x += dx / dist * speed * dt;
      e.position.z += dz / dist * speed * dt;
      e.rotation.y = Math.atan2(dx, dz);
      e.userData.phase += dt * 8;
      for (const l of e.userData.limbs) {
        const s = Math.sin(e.userData.phase);
        l.mesh.rotation.x = l.type === 'arm' ? s * l.side * 0.55 : -s * l.side * 0.55;
      }
      e.userData.head.rotation.z = Math.sin(e.userData.phase * 0.5) * 0.03;
    } else {
      hurt();
    }
  }

  if (enemies.length === 0 && player.kills < 52) spawnEnemy();
}

let joyX = 0, joyY = 0, joyActive = false, lookTouch = null, lastTouchX = 0, lastTouchY = 0;
const joy = document.querySelector('#joystick');
const stick = document.querySelector('#stick');

joy.addEventListener('pointerdown', e => {
  joyActive = true;
  joy.setPointerCapture(e.pointerId);
  moveJoy(e);
});
joy.addEventListener('pointermove', e => { if (joyActive) moveJoy(e); });
function moveJoy(e) {
  const r = joy.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const len = Math.hypot(dx, dy);
  const max = 43;
  if (len > max) {
    dx = dx / len * max;
    dy = dy / len * max;
  }
  joyX = dx / max;
  joyY = dy / max;
  stick.style.transform = `translate(\( {dx}px, \){dy}px)`;
}
function endJoy() {
  joyActive = false;
  joyX = joyY = 0;
  stick.style.transform = 'translate(0,0)';
}
joy.addEventListener('pointerup', endJoy);
joy.addEventListener('pointercancel', endJoy);

const look = document.querySelector('#look');
look.addEventListener('pointerdown', e => {
  lookTouch = e.pointerId;
  lastTouchX = e.clientX;
  lastTouchY = e.clientY;
  look.setPointerCapture(e.pointerId);
});
look.addEventListener('pointermove', e => {
  if (lookTouch !== e.pointerId) return;
  const dx = e.clientX - lastTouchX;
  const dy = e.clientY - lastTouchY;
  lastTouchX = e.clientX;
  lastTouchY = e.clientY;
  yaw -= dx * 0.006;
  pitch = Math.max(-1.25, Math.min(1.25, pitch - dy * 0.006));
});
look.addEventListener('pointerup', () => lookTouch = null);
look.addEventListener('pointercancel', () => lookTouch = null);

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') reload();
  if (e.code === 'KeyF') toggleFlash();
  if (e.code === 'Space') shoot();
});
addEventListener('keyup', e => keys[e.code] = false);

renderer.domElement.addEventListener('click', () => {
  if (started && matchMedia('(pointer:fine)').matches) {
    renderer.domElement.requestPointerLock?.();
  }
});
addEventListener('mousemove', e => {
  if (document.pointerLockElement === renderer.domElement) {
    yaw -= e.movementX * 0.0025;
    pitch = Math.max(-1.25, Math.min(1.25, pitch - e.movementY * 0.0025));
  }
});

function toggleFlash() {
  player.flash = !player.flash;
}

document.querySelector('#fire').addEventListener('pointerdown', shoot);
document.querySelector('#reload').addEventListener('click', reload);
document.querySelector('#flash').addEventListener('click', toggleFlash);

// 모바일에서도 확실하게 작동하는 시작 버튼
function startGame() {
  const overlay = document.querySelector('#overlay');
  overlay.classList.add('hidden');
  overlay.style.display = 'none';
  started = true;
  startAudio();
  if (matchMedia('(pointer:fine)').matches) {
    renderer.domElement.requestPointerLock?.();
  }
}
document.querySelector('#start').addEventListener('click', startGame);
document.querySelector('#start').addEventListener('touchend', e => {
  e.preventDefault();
  startGame();
});

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}
updateHud();
loop();
</script>
</body>
</html>
